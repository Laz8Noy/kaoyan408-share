tr:hover td{background:#f8fafc}
.school{font-weight:600}.col{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px;max-width:320px}

var REGIONS=["华北","华东","东北","华中","华南","西南","西北"];
function esc(s){return String(s==null?"—":s);}

var all=[];
["S","C"].forEach(function(k){DATA[k].forEach(function(d){d._grp=k;all.push(d);});});

// 层次选项按数据动态生成
(function(){
  var order=["985","211","双一流学科","双一流","双非"];
  var seen={};
  all.forEach(function(d){seen[d.t]=1;});
  var sel=document.getElementById("tier");
  order.filter(function(x){return seen[x];}).forEach(function(x){
    sel.innerHTML+='<option value="'+x+'">仅'+x+'</option>';
  });
})();

// 地区多选（点 label 切换样式）
var rg=document.getElementById("regions");
rg.innerHTML=REGIONS.map(function(r){return '<label><input type="checkbox" value="'+r+'"><span>'+r+'</span></label>';}).join("");
rg.addEventListener("change",function(e){
  if(e.target.tagName==="INPUT")e.target.parentNode.classList.toggle("on",e.target.checked);
  render();
});

function subjOf(d){return d.nn&&d.nn.subj?d.nn.subj:"";}
function isCore(d){return d.src!=="N诺";}

function render(){
  var T=parseInt(document.getElementById("score").value)||320;
  var tier=document.getElementById("tier").value;
  var srcf=document.getElementById("srcf").value;
  var subj=document.getElementById("subj").value;
  var regs=[];
  document.querySelectorAll("#regions input:checked").forEach(function(c){regs.push(c.value);});

  var rows=all.filter(function(d){
    if(tier&&d.t!==tier)return false;
    if(srcf==="core"&&!isCore(d))return false;
    if(srcf==="N诺"&&isCore(d))return false;
    if(subj==="22408"&&subjOf(d).indexOf("英二数二408")<0)return false;
    if(regs.length&&regs.indexOf(d.r)<0)return false;
    return true;
  }).map(function(d){
    return {d:d,m:d.l==null?null:T-d.l};
  });

  var groups={chong:[],wen:[],bao:[],na:[]};
  rows.forEach(function(r){
    if(r.m==null)groups.na.push(r);
    else if(r.m<10)groups.chong.push(r);
    else if(r.m<30)groups.wen.push(r);
    else groups.bao.push(r);
  });
  // 各组内线差大的排前（待核组按学校名）
  ["chong","wen","bao"].forEach(function(k){
    groups[k].sort(function(a,b){return b.m-a.m;});
  });
  groups.na.sort(function(a,b){return a.d.n<b.d.n?-1:1;});

  document.getElementById("stats").innerHTML=
    "命中 <b>"+rows.length+"</b> 条　冲 <b>"+groups.chong.length+"</b>　稳 <b>"+groups.wen.length+"</b>　保 <b>"+groups.bao.length+"</b>　待核 <b>"+groups.na.length+"</b>";

  function tbl(list,tagCls,tagTxt){
    if(!list.length)return '<div class="empty">（无符合条件院校）</div>';
    return '<div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>档位</th><th>院校</th><th>学院/方向</th><th>层次</th><th>地区</th><th>2026线</th><th>线差</th><th>复录比</th><th>AI方向</th><th>来源</th><th>备注</th></tr></thead><tbody>'+
    list.map(function(r){
      var d=r.d;
      var mCls=r.m==null?"":(r.m>=30?"margin-big":(r.m>=10?"margin-mid":"margin-low"));
      var wd=d.wd&&d.wd.u?' <a href="'+d.wd.u+'" target="_blank" rel="noopener">考情↗</a>':"";
      return '<tr><td><span class="tag '+tagCls+'">'+tagTxt+'</span></td>'+
      '<td class="school">'+esc(d.n)+(d._grp==="C"?' <span class="tier">对照</span>':"")+'</td>'+
      '<td class="col">'+esc(d.c)+'<br>'+esc(d.d)+'</td>'+
      '<td><span class="tier">'+esc(d.t)+'</span></td>'+
      '<td>'+esc(d.p)+'·'+esc(d.r)+'</td>'+
      '<td>'+(d.l==null?"—":d.l)+'</td>'+
      '<td class="'+mCls+'">'+(r.m==null?"—":(r.m>0?"+":"")+r.m)+'</td>'+
      '<td>'+(d.rr==null?"—":d.rr)+'</td>'+
      '<td>'+esc(d.ai)+'</td>'+
      '<td class="col">'+esc(d.src)+wd+'</td>'+
      '<td class="note">'+esc(d.note)+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  }
  document.getElementById("g-chong").innerHTML=tbl(groups.chong,"t-chong","冲");
  document.getElementById("g-wen").innerHTML=tbl(groups.wen,"t-wen","稳");
  document.getElementById("g-bao").innerHTML=tbl(groups.bao,"t-bao","保");
  document.getElementById("g-na").innerHTML=tbl(groups.na,"t-na","待核");
}
["score","tier","srcf","subj"].forEach(function(id){
  document.getElementById(id).addEventListener("input",render);
});
render();
</script>
